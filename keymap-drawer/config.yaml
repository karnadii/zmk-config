draw_config:
  key_w: 60
  key_h: 56
  split_gap: 30.0
  combo_w: 28
  combo_h: 26
  key_rx: 6.0
  key_ry: 6.0
  dark_mode: true
  n_columns: 1
  separate_combo_diagrams: true
  combo_diagrams_scale: 2
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 30.0
  outer_pad_h: 56.0
  line_spacing: 1.2
  arc_radius: 6.0
  append_colon_to_layer_header: true
  small_pad: 2.0
  legend_rel_x: 0.0
  legend_rel_y: 0.0
  draw_key_sides: false
  key_side_pars:
    rel_x: 0.0
    rel_y: 4.0
    rel_w: 12.0
    rel_h: 12.0
    rx: 4.0
    ry: 4.0
  svg_extra_style: ''
  footer_text: Created with <a href="https://github.com/caksoylar/keymap-drawer">keymap-drawer</a>
  shrink_wide_legends: 7
  style_layer_activators: true
  glyph_tap_size: 14
  glyph_hold_size: 12
  glyph_shifted_size: 10
  glyphs: {}
parse_config:
  preprocess: true
  skip_binding_parsing: false
  # Mouse nav bindings (added for the Geulis functions layer). Keymap-drawer
  # has no native support for these ZMK v0.3 two-axis mouse behaviors yet, so
  # we map them to legible labels here.
  raw_binding_map:
    "&mmv MOVE_UP":    "M↑"
    "&mmv MOVE_DOWN":  "M↓"
    "&mmv MOVE_LEFT":  "M←"
    "&mmv MOVE_RIGHT": "M→"
    "&mkp LCLK":       "LCK"
    "&mkp MCLK":       "MID"
    "&mkp RCLK":       "ROK"
    # Layer-lock tap-dance bindings. keymap-drawer v0.23 doesn't recognize
    # `compatible = "zmk,behavior-tap-dance"` so the bindings render as raw
    # text ("&set_lock", "&fun_lock") by default. The two entries below
    # override the rendering with action labels showing the tap/double-tap
    # UX. The icons themselves are deliberate placeholders; the actual
    # tap-dance entry references the behavior labels in the keymap.
    #
    # `&set_lock` (SET-layer lock): tap = momentary layer 2, double-tap =
    # toggle-lock layer 2. We render "2" / "lock 2" because that's literally
    # what the user typed in the binding cells; the action verb is the
    # `'type': 'key tap dance'` annotation so keymap-drawer treats it as a
    # tap-dance glyph rather than a plain keypress.
    "&set_lock":    {tap: "Tap 2",   hold: "Lock 2"}
    "&fun_lock":    {tap: "Tap 1",   hold: "Lock 1"}
    # SET layer row 0 — host-app-launch shortcuts (LG = Cmd on Mac, Super+ on
    # Linux, Win+ on Windows). Bindings here are full `&kp ...` strings so
    # we don't accidentally map plain TAB / E (which are used elsewhere on
    # the keyboard) to a launcher icon.
    #
    # `&kp LG(TAB)` — Cmd+Tab on Mac, Alt+Tab on Windows. Mapped to
    # `mdi:apps` (3×3 grid) for the "App Switcher" / Task View metaphor.
    "&kp LG(TAB)":     "$$mdi:apps$$"
    # `&kp LG(E)` — Cmd+E on Mac (context-dependent, often "Use Selection
    # for Find" in browsers and text editors) / Win+E on Windows (launches
    # File Explorer universally). The `folder` glyph reads as "open files"
    # on either platform; on Windows it matches the actual behavior exactly.
    "&kp LG(E)":       "$$mdi:folder$$"
    # Power / lock icons. ZMK behaviors `&studio_unlock` (combos unlock
    # the on-keyboard remapping), `&soft_off` (firmware sleep), and
    # `&ext_power EP_TOG/ON/OFF` (external power to USB / external).
    # We use full binding strings here so plain `&kp LOCK` or other uses
    # elsewhere are not affected.
    #
    # `&studio_unlock` — MDI's `lock-open-variant` shows an "unlocked" lock
    # glyph without any encryption-style overlay, reading cleanly as
    # "release the keymap's lock". The `lock-open-check` variant adds a tiny
    # check-mark for an even clearer "unlock confirmed" reading.
    "&studio_unlock":     "$$mdi:lock-open-variant$$"
    # `&soft_off` — MDI has no literal `power-outline`; the closest is
    # `power` (filled). For "shutdown" semantics `power-standby` reads as
    # "system sleep / off" and is the universal pre-modern power-button
    # glyph. Both work; the standby variant emphasizes "going to sleep".
    "&soft_off":           "$$mdi:power-standby$$"
    # `&ext_power EP_TOG` — outlined power icon. MDI doesn't have a
    # `power-outline` family, so we use `power-plug-outline` instead —
    # the outline-stroked version of a power plug, which reads as
    # "external power toggle" / "USB power gating".
    "&ext_power EP_TOG":   "$$mdi:power-plug-outline$$"
    "&ext_power EP_ON":    "$$mdi:power-plug-outline$$"
    "&ext_power EP_OFF":   "$$mdi:power-plug-outline$$"
    # `&sys_reset` — reboot the microcontroller. The `restart-alert` glyph
    # is a clockwise-arrow-with-exclamation-mark that conveys both "reload"
    # AND a warning that this drops BLE state / RAM config — which matches
    # the actual semantics of `&sys_reset`.
    "&sys_reset":           "$$mdi:restart-alert$$"
    # `&bootloader` — enter UF2 bootloader mode (USB Mass Storage mount).
    # The `usb-flash-drive-outline` glyph reads as a USB stick, which is
    # exactly what the user sees when they bootload: a new drive appears
    # on their host computer. Outlined variant matches the styling used by
    # other "secondary" actions in this config.
    "&bootloader":          "$$mdi:usb-flash-drive-outline$$"
  sticky_label: sticky
  toggle_label: toggle
  tap_toggle_label: tap-toggle
  trans_legend:
    t: ▽
    type: trans
  mark_alternate_layer_activators: false
  modifier_fn_map:
    left_ctrl: Ctl
    right_ctrl: Ctl
    left_shift: Sft
    right_shift: Sft
    left_alt: Alt
    right_alt: AGr
    left_gui: Gui
    right_gui: Gui
    keycode_combiner: '{mods}+ {key}'
    mod_combiner: '{mod_1}+{mod_2}'
    special_combinations:
      left_ctrl+left_alt+left_gui+left_shift: Hyper
      left_ctrl+left_alt+left_shift: Meh
  qmk_remove_keycode_prefix:
  - KC_
  qmk_keycode_map:
    XXXXXXX: ''
    'NO': ''
    MINUS: '-'
    MINS: '-'
    EQUAL: '='
    EQL: '='
    LEFT_BRACKET: '['
    LBRC: '['
    RIGHT_BRACKET: ']'
    RBRC: ']'
    BACKSLASH: \
    BSLS: \
    NONUS_HASH: '#'
    NUHS: '#'
    SEMICOLON: ;
    SCLN: ;
    QUOTE: ''''
    QUOT: ''''
    GRAVE: '`'
    GRV: '`'
    COMMA: ','
    COMM: ','
    DOT: .
    SLASH: /
    SLSH: /
    TILDE: '~'
    TILD: '~'
    EXCLAIM: '!'
    EXLM: '!'
    AT: '@'
    HASH: '#'
    DOLLAR: $
    DLR: $
    PERCENT: '%'
    PERC: '%'
    CIRCUMFLEX: ^
    CIRC: ^
    AMPERSAND: '&'
    AMPR: '&'
    ASTERISK: '*'
    ASTR: '*'
    LEFT_PAREN: (
    LPRN: (
    RIGHT_PAREN: )
    RPRN: )
    UNDERSCORE: _
    UNDS: _
    PLUS: +
    LEFT_CURLY_BRACE: '{'
    LCBR: '{'
    RIGHT_CURLY_BRACE: '}'
    RCBR: '}'
    PIPE: '|'
    COLON: ':'
    COLN: ':'
    DOUBLE_QUOTE: '"'
    DQUO: '"'
    DQT: '"'
    LEFT_ANGLE_BRACKET: <
    LABK: <
    LT: <
    RIGHT_ANGLE_BRACKET: '>'
    RABK: '>'
    GT: '>'
    QUESTION: '?'
    QUES: '?'
  zmk_remove_keycode_prefix: []
  zmk_keycode_map:
    EXCLAMATION: '!'
    EXCL: '!'
    AT_SIGN: '@'
    AT: '@'
    HASH: '#'
    POUND: '#'
    DOLLAR: $
    DLLR: $
    PERCENT: '%'
    PRCNT: '%'
    CARET: ^
    AMPERSAND: '&'
    AMPS: '&'
    ASTERISK: '*'
    ASTRK: '*'
    STAR: '*'
    LEFT_PARENTHESIS: (
    LPAR: (
    RIGHT_PARENTHESIS: )
    RPAR: )
    EQUAL: '='
    PLUS: +
    MINUS: '-'
    UNDERSCORE: _
    UNDER: _
    SLASH: /
    FSLH: /
    QUESTION: '?'
    QMARK: '?'
    BACKSLASH: \
    BSLH: \
    PIPE: '|'
    NON_US_BACKSLASH: \
    PIPE2: '|'
    NON_US_BSLH: '|'
    SEMICOLON: ;
    SEMI: ;
    COLON: ':'
    SINGLE_QUOTE: ''''
    SQT: ''''
    APOSTROPHE: ''''
    APOS: ''''
    DOUBLE_QUOTES: '"'
    DQT: '"'
    COMMA: ','
    LESS_THAN: <
    LT: <
    PERIOD: .
    DOT: .
    GREATER_THAN: '>'
    GT: '>'
    LEFT_BRACKET: '['
    LBKT: '['
    LEFT_BRACE: '{'
    LBRC: '{'
    RIGHT_BRACKET: ']'
    RBKT: ']'
    RIGHT_BRACE: '}'
    RBRC: '}'
    GRAVE: '`'
    TILDE: '~'
    NON_US_HASH: '#'
    NUHS: '#'
    TILDE2: '~'
    # Common ASCII-name → MDI icon mappings. The parser falls back to a
    # string-lookup on keycodes parsed from `&kp X` bindings, so `RET`,
    # `TAB`, `ESC`, `DEL`, `BACKSPACE`, `CAPS`, `LSHFT`, `RSHFT` are all
    # reachable exactly by their ZMK name. Glyphs come from the local cache
    # at ~/.cache/keymap-drawer/glyphs/mdi:<name>.svg (auto-fetched upstream
    # from Templarian/MaterialDesign-SVG).
    RET:       "$$mdi:keyboard-return$$"
    SPACE:     "$$mdi:keyboard-space$$"
    TAB:       "$$mdi:keyboard-tab$$"
    ESC:       "$$mdi:keyboard-esc$$"
    DEL:       "$$mdi:backspace-reverse-outline$$"
    # `keyboard-backspace` shows a leftward arrow inside a keycap —
    # visually reads as a single backspace (delete-left) glyph, matching
    # Windows / Mac convention. Variant exists if you prefer outline only.
    BACKSPACE: "$$mdi:keyboard-backspace$$"
    # Apple-keyboard-shift is the standard "hollow up arrow over a chunky
    # trapezoid" — same icon used on iOS / iPadOS / macOS keyboards, makes
    # the SHIFT key instantly recognizable. Both LSHFT and RSHFT map.
    LSHFT:     "$$mdi:apple-keyboard-shift$$"
    RSHFT:     "$$mdi:apple-keyboard-shift$$"
    LSHIFT:    "$$mdi:apple-keyboard-shift$$"
    RSHIFT:    "$$mdi:apple-keyboard-shift$$"
    CAPS:      "$$mdi:keyboard-caps$$"
    # Media / brightness keys for the SET layer (used by `&kp C_*`).
    # MDI has no `volume-up` / `volume-down` icons, so we use the
    # `volume-plus` and `volume-minus` glyphs (which depict the same
    # concept). `C_PP` is paired play+pause (toggle play, toggle pause).
    # Both 6-letter and 4-letter ZMK keycode aliases are listed because
    # the Geulis uses both forms in different morphs (e.g. `C_PREV` on
    # the FUN layer, `C_PREVIOUS` on the SET layer).
    C_PREVIOUS: "$$mdi:skip-previous$$"
    C_PREV:     "$$mdi:skip-previous$$"
    C_PP:       "$$mdi:play-pause$$"
    C_NEXT:     "$$mdi:skip-next$$"
    C_MUTE:     "$$mdi:volume-mute$$"
    C_VOL_DN:   "$$mdi:volume-minus$$"
    C_VOL_UP:   "$$mdi:volume-plus$$"
    # `brightness-4` and `brightness-7` are MDI's two endpoints of the
    # brightness scale (25% / 100%); we use those for DEC and UP
    # respectively so the SET layer's brightness column reads
    # intuitively without needing directional arrows. Both 6-letter
    # and 4-letter ZMK keycode aliases are listed.
    C_BRI_DEC:  "$$mdi:brightness-4$$"
    C_BRI_DN:   "$$mdi:brightness-4$$"
    C_BRI_UP:   "$$mdi:brightness-7$$"
    # Arrow keys (UP / DOWN / LEFT / RIGHT). Used on the FUN layer's
    # navigation column. Single-line arrows use the `arrow-*` (thin)
    # family which renders as a single stroke — visually lighter than
    # the bold-outline variant, matches the typographic feel of the
    # other thin-stroked arrows used in the FUN layer chip.
    UP:    "$$mdi:arrow-up$$"
    DOWN:  "$$mdi:arrow-down$$"
    LEFT:  "$$mdi:arrow-left$$"
    RIGHT: "$$mdi:arrow-right$$"
    # Modifiers — Apple-keyboard icons for keyboard diagrams. Match the
    # same visual language as iOS / iPadOS / macOS keyboards so the
    # modifier cluster reads as a coherent "Apple modifier set":
    #   GUI (Cmd on Mac, Win on Windows, Super on Linux) ↦ apple-keyboard-command  (⌘)
    #   CTL    ↦ apple-keyboard-control  (⌃)
    #   ALT    ↦ apple-keyboard-option   (⌥)
    #   SHIFT  ↦ apple-keyboard-shift    (⇧, defined above)
    #   LS / RS / LC / RC / LG variants are accepted alongside the full
    #   names for completeness.
    LCTL:  "$$mdi:apple-keyboard-control$$"
    LCTRL: "$$mdi:apple-keyboard-control$$"
    RCTL:  "$$mdi:apple-keyboard-control$$"
    RCTRL: "$$mdi:apple-keyboard-control$$"
    LALT:  "$$mdi:apple-keyboard-option$$"
    RALT:  "$$mdi:apple-keyboard-option$$"
    LGUI:  "$$mdi:apple-keyboard-command$$"
    RGUI:  "$$mdi:apple-keyboard-command$$"
    # ZMK also uses KC_* and C_* prefixes occasionally; cover the common ones.
    LC:    "$$mdi:apple-keyboard-control$$"
    LS:    "$$mdi:apple-keyboard-shift$$"
    LG:    "$$mdi:apple-keyboard-command$$"
  zmk_combos: {}
  zmk_preamble: '#define KEYMAP_DRAWER'
  zmk_additional_includes: []
