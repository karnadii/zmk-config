description: ZMK HID/layer indicator LED driver (backport for ZMK v0.3)

compatible: "zmk,indicator-leds"

child-binding:
  description: |
    An entry mapping either a HID indicator bit or an active layer to
    one or more GPIO LEDs. Exactly one of `indicator` or `layer` must
    be set.

    `leds` is an array of phandles to existing `gpio-leds` children
    (the same nodes bound by the standard Zephyr GPIO LED driver).
    Multiple LEDs are driven in parallel (e.g. wire two LEDs to the
    same indicator).
  compatible: "zmk,indicator-leds-entry"

  properties:
    indicator:
      type: int
      required: false
      description: |
        HID indicator bit number (0..7). 0 = Num Lock, 2 = Caps Lock,
        3 = Scroll Lock, 4 = Compose, 5 = Kana. Mutually exclusive
        with `layer`.
    layer:
      type: int
      required: false
      description: |
        Zero-based keymap layer index. The LED is on whenever this
        layer is the highest active one. Mutually exclusive with
        `indicator`.
    leds:
      type: phandles
      required: true
      description: |
        Phandles to one or more `gpio-leds` children, each specifying
        a `gpios` property. The driver reconfigures those pins as
        outputs and drives them directly.
