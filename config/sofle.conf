# Sofle RGB v2.1 on nrfmicro_13-compatible nRF52840 controllers.
# The upstream ZMK v0.3 Sofle shield provides the matrix, encoder, and OLED
# devicetree nodes. Enable only the hardware populated on this build.

# This controller has a populated external 32.768 kHz crystal.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_20PPM=y

# -----------------------------------------------------------------------------
# 128x32 SSD1306 OLED with nice!oled (custom vertical status screen)
# -----------------------------------------------------------------------------
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_OLED_ON=y
CONFIG_NICE_OLED_WIDGET_RAW_HID=n

# Central Screen (Right half):
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT_ANIMATION_MS=250
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_LAYER=y

# Peripheral Screen (Left half):
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=y
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_IDLE=y
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_SLEEP=y

# LVGL & Thread Performance:
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=2048
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# One EC11 encoder is enabled by each half's upstream Sofle overlay.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Enable ZMK Pointing / Mouse keys (mmv, mkp, msc)
CONFIG_ZMK_POINTING=y

# Keep the battery-powered halves responsive without enabling any lighting.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# RGB underglow is intentionally not enabled: the LED footprints are not
# populated on this Sofle build.
