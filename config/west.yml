manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
    - name: zmk-nice-oled
      remote: mctechnology17
      revision: main
  self:
    path: config
    # Expose the `west zephyr-export` extension command provided by ZMK's
    # bundled scripts. The `zmk/app/scripts/west-commands.yml` file is
    # fetched by `west update`; until then west itself doesn't need the command.
    west-commands: zmk/app/scripts/west-commands.yml
