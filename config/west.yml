manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
  self:
    path: config
    # Expose the `west zephyr-export` extension command provided by ZMK's
    # bundled scripts. The `zmk/app/scripts/west-commands.yml` file is
    # fetched by `west update`; until then west itself doesn't need the command.
    west-commands: zmk/app/scripts/west-commands.yml
