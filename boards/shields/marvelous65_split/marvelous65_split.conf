# Power management
CONFIG_ZMK_PM_SOFT_OFF = y
CONFIG_ZMK_EXT_POWER = y

CONFIG_ZMK_IDLE_SLEEP_TIMEOUT = 480000

# ZMK split keyboard: each half runs the same image; the shield's
# Kconfig.shield picks which role (central / peripheral) based on
# -DSHIELD=marvelous65_split_{left,right}.
CONFIG_ZMK_SPLIT=y

# EC11 trigger — both halves have an encoder. The trigger choice has
# to be set in a .conf file (Kconfig.defconfig can't 'default' a
# choice symbol).
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y