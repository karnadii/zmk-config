# ZMK firmware build + release pipeline.
#
# Inlined from zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
# so we can pin actions/checkout, actions/cache, actions/upload-artifact,
# and actions/download-artifact to current Node 24-compatible majors (v6/v7)
# and avoid the deprecation warnings GitHub emits when v0.3 of the upstream
# workflow references actions on Node 20. The build steps are byte-equivalent
# to the v0.3 reusable workflow; only the action versions differ.
name: Build ZMK firmware

on:
  push:
    branches:
      - v0.3-stable
      - main
    paths:
      - build.yaml
      - 'config/**'
      - 'boards/**'
      - 'boards/shields/**'
      - .github/workflows/build.yml
      - docker/**

  pull_request:
    branches:
      - v0.3-stable
      - main

  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'    # Runs at 10:00 UTC every Monday

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-22.04
    name: Fetch Build Keyboards
    outputs:
      build_matrix: ${{ env.build_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch Build Matrix
        run: |
          echo "build_matrix=$(yq -oj -I0 'build.yaml')" >> $GITHUB_ENV
          yq -oj 'build.yaml'

  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    needs: matrix
    name: Build
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create build directory
        run: |
          echo "build_dir=$(mktemp -d)" >> $GITHUB_ENV

      - name: Prepare variables
        shell: sh -x {0}
        env:
          board: ${{ matrix.board }}
          shield: ${{ matrix.shield }}
          artifact_name: ${{ matrix.artifact-name }}
          snippet: ${{ matrix.snippet }}
        run: |
          if [ -e zephyr/module.yml ]; then
            export zmk_load_arg=" -DZMK_EXTRA_MODULES='${GITHUB_WORKSPACE}'"
            new_tmp_dir="${TMPDIR:-/tmp}/zmk-config"
            mkdir -p "${new_tmp_dir}"
            echo "base_dir=${new_tmp_dir}" >> $GITHUB_ENV
          else
            echo "base_dir=${GITHUB_WORKSPACE}" >> $GITHUB_ENV
          fi

          if [ -n "${snippet}" ]; then
            extra_west_args="-S \"${snippet}\""
          fi

          echo "zephyr_version=${ZEPHYR_VERSION}" >> $GITHUB_ENV
          echo "extra_west_args=${extra_west_args}" >> $GITHUB_ENV
          echo "extra_cmake_args=${shield:+-DSHIELD=\"$shield\"}${zmk_load_arg}" >> $GITHUB_ENV
          echo "display_name=${shield:+$shield - }${board}" >> $GITHUB_ENV
          echo "artifact_name=${artifact_name:-${shield:+$shield-}${board}-zmk}" >> $GITHUB_ENV

      - name: Copy config files to isolated temporary directory
        run: |
          if [ "${{ env.base_dir }}" != "${GITHUB_WORKSPACE}" ]; then
            mkdir "${{ env.base_dir }}/config"
            cp -R config/* "${{ env.base_dir }}/config/"
          fi

      - name: Cache west modules
        uses: actions/cache@v6
        continue-on-error: true
        env:
          cache_name: cache-zephyr-${{ env.zephyr_version }}-modules
        with:
          path: |
            ${{ env.base_dir }}/modules/
            ${{ env.base_dir }}/tools/
            ${{ env.base_dir }}/zephyr/
            ${{ env.base_dir }}/bootloader/
            ${{ env.base_dir }}/zmk/
          key: ${{ runner.os }}-build-${{ env.cache_name }}-${{ hashFiles('**/west.yml', '**/build.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache_name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: West Init
        working-directory: ${{ env.base_dir }}
        run: west init -l "${{ env.base_dir }}/config"

      - name: West Update
        working-directory: ${{ env.base_dir }}
        run: west update --fetch-opt=--filter=tree:0

      - name: West Zephyr export
        working-directory: ${{ env.base_dir }}
        run: west zephyr-export

      - name: West Build (${{ env.display_name }})
        working-directory: ${{ env.base_dir }}
        shell: sh -x {0}
        run: west build -s zmk/app -d "${{ env.build_dir }}" -b "${{ matrix.board }}" ${{ env.extra_west_args }} -- -DZMK_CONFIG=${{ env.base_dir }}/config ${{ env.extra_cmake_args }} ${{ matrix.cmake-args }}

      - name: ${{ env.display_name }} Kconfig file
        run: |
          if [ -f "${{ env.build_dir }}/zephyr/.config" ]
          then
            grep -v -e "^#" -e "^$" "${{ env.build_dir }}/zephyr/.config" | sort
          else
            echo "No Kconfig output"
          fi
        if: ${{ !cancelled() }}

      - name: ${{ env.display_name }} Devicetree file
        run: |
          if [ -f "${{ env.build_dir }}/zephyr/zephyr.dts" ]
          then
            cat "${{ env.build_dir }}/zephyr/zephyr.dts"
          elif [ -f "${{ env.build_dir }}/zephyr/zephyr.dts.pre" ]
          then
            cat -s "${{ env.build_dir }}/zephyr/zephyr.dts.pre"
          else
            echo "No Devicetree output"
          fi
        if: ${{ !cancelled() }}

      - name: Rename artifacts
        shell: sh -x {0}
        run: |
          mkdir "${{ env.build_dir }}/artifacts"
          if [ -f "${{ env.build_dir }}/zephyr/zmk.uf2" ]
          then
            cp "${{ env.build_dir }}/zephyr/zmk.uf2" "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.uf2"
          elif [ -f "${{ env.build_dir }}/zephyr/zmk.bin" ]
          then
            cp "${{ env.build_dir }}/zephyr/zmk.bin" "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.bin"
          fi

      - name: Archive (${{ env.display_name }})
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ env.artifact_name }}
          path: ${{ env.build_dir }}/artifacts

  release:
    name: Publish UF2 firmware
    # Publish on either a push to a release branch (v0.3-stable, main) or
    # a manual `workflow_dispatch` run. PR builds and the weekly schedule
    # never trigger a release — those just exercise the build matrix to
    # catch regressions.
    #
    # Each release uses a fresh, unique tag (build-<run_id>) so we never
    # overwrite an existing release. The release body is set explicitly
    # (no `generate_release_notes`) so it does not accumulate between
    # runs, and `make_latest` re-points GitHub's "Latest" badge to the
    # newest release. Old releases are pruned to keep the list from
    # growing without bound.
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/v0.3-stable' || github.ref == 'refs/heads/main'))
      || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Group artifacts by keyboard
        run: |
          set -euo pipefail
          mkdir -p grouped
          for uf2 in artifacts/*.uf2; do
            [ -f "$uf2" ] || continue
            # Artifact names look like "<keyboard>-zmk[-<variant>].uf2"
            # (e.g. geulis-zmk.uf2, nrfmicro_13-marvelous65_split_left-zmk.uf2).
            # Strip the trailing "-zmk[-<variant>].uf2" to recover the
            # keyboard directory. The `-(zmk|zmk-.+)` capture handles
            # both the base build and the studio/logging/reset variants.
            base=$(basename "$uf2" .uf2)
            keyboard=$(printf '%s' "$base" | sed -E 's/-zmk(-.+)?$//')
            mkdir -p "grouped/${keyboard}"
            cp "$uf2" "grouped/${keyboard}/"
          done
          echo "## UF2 files to release:"
          find grouped -name '*.uf2' -type f | sort

      - name: Determine release metadata
        id: meta
        run: |
          set -euo pipefail
          # Build a UTC date (YYYY-MM-DD) and a short SHA so the release
          # name is human-readable and reproducible from the workflow
          # inputs alone.
          date=$(date -u +%Y-%m-%d)
          short_sha=${GITHUB_SHA::7}
          branch=${GITHUB_REF_NAME}
          # Tag MUST be unique per run so softprops/action-gh-release
          # always takes the "create" path. github.run_id is unique
          # across all workflow runs in a repo.
          tag="build-${date}-${short_sha}-${GITHUB_RUN_ID}"
          name="ZMK Firmware — ${branch} @ ${short_sha} (${date})"
          {
            echo "tag=${tag}"
            echo "name=${name}"
            echo "date=${date}"
            echo "short_sha=${short_sha}"
            echo "branch=${branch}"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          make_latest: 'true'
          fail_on_unmatched_files: false
          body: |
            ZMK firmware built from **${{ steps.meta.outputs.branch }}** @ `${{ steps.meta.outputs.short_sha }}` on ${{ steps.meta.outputs.date }} (UTC).

            Artifacts are grouped by keyboard:
            - `geulis/` — Geulis (Alice, 7×10)
            - `marvelous65/` — Marvelous65 Rev2 (65% ANSI)
            - `marvelous65_ergo/` — Marvelous65 Ergo (65% ergo, split B)
            - `nrfmicro_13-marvelous65_split_{left,right}/` — Marvelous65 Split halves (nrfmicro_13)

            See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the full build log.
          files: |
            grouped/**/*.uf2

      - name: Prune old releases
        # Keep at most `keep_count` most-recent releases on this branch
        # so the releases page doesn't grow unbounded. Never deletes
        # the release we just created in this run.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.meta.outputs.branch }}
          current_tag: ${{ steps.meta.outputs.tag }}
          keep_count: 5
        run: |
          set -euo pipefail
          echo "::group::Listing releases tagged on branch '${branch}'"
          mapfile -t releases < <(
            gh release list \
              --repo "${{ github.repository }}" \
              --limit 100 \
              --json tagName,name,isDraft,isPrerelease,createdAt \
              --jq '.[] | select(.tagName | startswith("build-")) | "\(.tagName)\t\(.createdAt)"' \
              | sort -k2 -r \
              | awk -F'\t' '{print $1}'
          )
          printf '%s\n' "${releases[@]}"
          echo "::endgroup::"

          total=${#releases[@]}
          if [ "$total" -le "$keep_count" ]; then
            echo "Nothing to prune (${total} release(s) ≤ keep_count=${keep_count})."
            exit 0
          fi

          echo "::group::Deleting ${keep_count} oldest releases"
          for tag in "${releases[@]:$keep_count}"; do
            # Skip the release we just published, even though it should
            # always be at the top of the list. Belt-and-braces.
            if [ "$tag" = "$current_tag" ]; then
              continue
            fi
            echo "Deleting release ${tag}"
            gh release delete --repo "${{ github.repository }}" --yes --cleanup-tag "$tag"
          done
          echo "::endgroup::"

      - name: Delete legacy 'latest' release
        # The pre-existing `latest` release accumulates body text on
        # every run and is no longer the canonical "Latest". Remove
        # it (and its tag) so the new per-run releases own the page.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view --repo "${{ github.repository }}" latest >/dev/null 2>&1; then
            echo "Deleting legacy 'latest' release"
            gh release delete --repo "${{ github.repository }}" --yes --cleanup-tag latest
          else
            echo "No legacy 'latest' release found — skipping."
          fi

  purge:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        uses: joshkyh/pull-request-action@c8a3ade91cd5d63ee7a8de93ec4b16d6e26a64c2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # keep the most recent 14 workflow runs
          max-keep-amount: 14
          # delete runs that finished more than 3 days ago
          retention-days: 3
          head-branch: ${{ github.ref }}
